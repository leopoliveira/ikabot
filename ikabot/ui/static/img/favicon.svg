<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="pedimentGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Subtle glow aura behind temple -->
  <circle cx="32" cy="32" r="18" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Greek Temple Group -->
  <g fill="url(#goldGrad)">
    <!-- Roof / Fronton Acroterion (Apex ornament) -->
    <path d="M 32,10.5 L 34,13.5 L 30,13.5 Z" />
    <circle cx="32" cy="10" r="1.2" />

    <!-- Triangular Pediment / Timpanum -->
    <path d="M 12,23 L 32,12.5 L 52,23 Z" fill="url(#pedimentGrad)"/>
    <!-- Inner Pediment Shadow/Relief -->
    <polygon points="17,22 32,14.5 47,22" fill="#92400e" opacity="0.65"/>
    <circle cx="32" cy="19.5" r="1.5" fill="#fef08a"/>

    <!-- Entablature / Architrave (Beam under roof) -->
    <rect x="13" y="23.5" width="38" height="3" rx="0.8" fill="url(#pedimentGrad)"/>

    <!-- Capital tops of columns -->
    <rect x="15" y="27" width="6" height="1.5" rx="0.5"/>
    <rect x="24.5" y="27" width="6" height="1.5" rx="0.5"/>
    <rect x="33.5" y="27" width="6" height="1.5" rx="0.5"/>
    <rect x="43" y="27" width="6" height="1.5" rx="0.5"/>

    <!-- 4 Fluted Columns -->
    <rect x="16" y="28.5" width="4" height="18" rx="0.8"/>
    <rect x="25.5" y="28.5" width="4" height="18" rx="0.8"/>
    <rect x="34.5" y="28.5" width="4" height="18" rx="0.8"/>
    <rect x="44" y="28.5" width="4" height="18" rx="0.8"/>

    <!-- Column bases -->
    <rect x="15" y="46.5" width="6" height="1.5" rx="0.5"/>
    <rect x="24.5" y="46.5" width="6" height="1.5" rx="0.5"/>
    <rect x="33.5" y="46.5" width="6" height="1.5" rx="0.5"/>
    <rect x="43" y="46.5" width="6" height="1.5" rx="0.5"/>

    <!-- Stylobate (Upper step) -->
    <rect x="12" y="48.5" width="40" height="2.5" rx="0.8" fill="url(#pedimentGrad)"/>

    <!-- Stereobate (Lower foundation step) -->
    <rect x="9" y="51.5" width="46" height="3" rx="1.2"/>
  </g>
</svg>
